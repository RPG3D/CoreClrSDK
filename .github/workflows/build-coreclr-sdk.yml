name: build-coreclr-sdk

# Builds CoreCLR for mobile targets from a pinned dotnet/runtime ref and
# populates this SDK's platform directory (android/), then uploads it as an
# artifact to be unpacked over the git-ignored binary dirs (same layout
# FetchCoreClrSDK.bat produces locally).
#
# android-arm64 mirrors the verified local Windows build
# (build.sh clr.runtime+...+libs -os android -arch arm64) — CopySDKFromSrc.sh
# populates android/{lib,runtime}.

on:
  workflow_dispatch:
    inputs:
      runtime_ref:
        description: 'dotnet/runtime ref (tag, branch or sha) — empty = SOURCE_TAG from DotNetRuntime.version'
        default: ''
        required: false
      build_config:
        description: 'Build configuration for the android job'
        default: 'Release'
        required: true

permissions:
  contents: read

jobs:
  android-arm64:
    name: android-arm64 (${{ inputs.build_config }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout SDK scripts
        uses: actions/checkout@v4

      - name: Checkout dotnet/runtime
        run: |
          REF="${{ inputs.runtime_ref }}"
          if [ -z "$REF" ]; then
            REF="$(grep -E '^SOURCE_TAG=' DotNetRuntime.version | cut -d= -f2- | tr -d '\r')"
          fi
          echo "Pinning dotnet/runtime to $REF"
          git clone --depth 1 --branch "$REF" \
            https://github.com/dotnet/runtime runtime-src

      - name: Select Android NDK
        run: |
          set -euo pipefail
          # Runners ship several NDKs; prefer r27+ (27.2 verified locally).
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$NDK_DIR" ]; then
            echo "No NDK found under ANDROID_HOME" >&2
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Build CoreCLR + libs (android arm64)
        working-directory: runtime-src
        run: |
          # Same subset BuildCoreClrSDK.sh uses (DotNetRuntime.version BUILD_SUBSET) -
          # clr.tools/clr.packages would add ~GB of ILCompiler/crossgen2/NuGet packaging
          # the SDK never consumes.
          SUBSET="$(grep -E '^BUILD_SUBSET=' "$GITHUB_WORKSPACE/DotNetRuntime.version" | cut -d= -f2- | tr -d '\r')"
          if [ -z "$SUBSET" ]; then
            echo "BUILD_SUBSET missing in DotNetRuntime.version" >&2
            exit 1
          fi
          echo "Building subset: $SUBSET"
          ./build.sh $SUBSET \
            -os android -arch arm64 -c ${{ inputs.build_config }}

      - name: Populate SDK (android)
        run: |
          bash CopySDKFromSrc.sh "$GITHUB_WORKSPACE/runtime-src" android ${{ inputs.build_config }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreclr-sdk-android-arm64-${{ inputs.build_config }}
          path: |
            android/lib/
            android/runtime/
            android/VERSION.txt
          if-no-files-found: error
