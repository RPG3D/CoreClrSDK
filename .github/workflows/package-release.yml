name: Package and Release CoreClrSDK

# Downloads the mobile platform SDKs from GitHub Actions artifacts and packages them
# into a single ZIP for release. Mirrors MonoSDK/.github/workflows/package-release.yml:
# one table of <dir>:<artifact-base> entries, one download loop, one zip.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      build_type:
        description: 'Build type to package'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      run_id:
        description: 'Specific build-all run ID (empty = latest successful run)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

env:
  # Informational only: the artifacts already carry their own VERSION.txt.
  # Resolved per release from DotNetRuntime.version (SOURCE_TAG) by the prepare step;
  # this env only feeds the release-notes blurb for runs without that step.
  RUNTIME_TAG: v11.0.0-rc.3.26522.148

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CoreClrSDK
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Download platform SDK artifacts
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow=build-all.yml \
              --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build-all.yml run found"
            exit 1
          fi
          echo "Using build-all run $RUN_ID"

          # <dest dir>:<artifact base name> - must match the uploads in build-all.yml.
          # Every platform uses <Platform>/<arch>/, so this table is the only per-platform data.
          ENTRIES="
          Android/arm64:CoreClrSDK-Android-arm64
          IOS/arm64:CoreClrSDK-iOS-arm64
          IOSSimulator/arm64:CoreClrSDK-iOS-Simulator-arm64
          "

          for ENTRY in $ENTRIES; do
            DIR="${ENTRY%%:*}"
            BASE="${ENTRY##*:}"
            ARTIFACT_NAME="${BASE}-${BUILD_TYPE}"
            rm -rf "$DIR"
            mkdir -p "$DIR"
            if gh run download "$RUN_ID" --repo ${{ github.repository }} \
                 --name "$ARTIFACT_NAME" --dir "$DIR"; then
              echo "OK   $DIR  <- $ARTIFACT_NAME"
            else
              echo "::error::Missing artifact $ARTIFACT_NAME in run $RUN_ID"
              exit 1
            fi
          done

      - name: Verify downloaded SDKs
        run: |
          set -e
          for DIR in Android/arm64 IOS/arm64 IOSSimulator/arm64; do
            echo "=== $DIR ==="
            test -f "$DIR/lib/libcoreclr.so" 2>/dev/null || test -f "$DIR/lib/libcoreclr.dylib"
            test -d "$DIR/runtime"
            COUNT=$(ls -1 "$DIR/runtime"/*.dll | wc -l)
            echo "  $COUNT BCL dlls"
            if [ "$COUNT" -lt 100 ]; then
              echo "::error::$DIR looks incomplete"
              exit 1
            fi
          done

      - name: Create package directory
        run: |
          mkdir -p package/CoreClrSDK
          cp -Rf Android IOS IOSSimulator package/CoreClrSDK/

          # Build + copy scripts and UBT integration files
          cp BuildCoreClrSDK.sh CopySDKFromSrc.sh MakeCoreClrFramework.sh \
             FetchCoreClrSDK.sh FetchCoreClrSDK.bat \
             DotNetRuntime.version CoreClrSDK.Build.cs CoreClrSDK_APL.xml \
             README.md .gitignore package/CoreClrSDK/

          # Shared public host ABI headers (tracked in git, one copy for every platform)
          cp -Rf include package/CoreClrSDK/

          echo "=== Package contents ==="
          ls -la package/CoreClrSDK/

      - name: Create ZIP archive
        run: |
          cd package
          ZIP_NAME="CoreClrSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type || 'Release' }}.zip"
          zip -r "$ZIP_NAME" CoreClrSDK/
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          ls -lh "$ZIP_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoreClrSDK-${{ github.event.inputs.version }}-${{ github.event.inputs.build_type || 'Release' }}
          path: package/${{ env.ZIP_NAME }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: CoreClrSDK ${{ github.event.inputs.version }}
          body: |
            CoreClrSDK release ${{ github.event.inputs.version }}

            ## Build Type
            ${{ github.event.inputs.build_type || 'Release' }}

            ## Platforms
            - Android arm64
            - iOS device arm64
            - iOS Simulator arm64

            ## Layout
            `<Platform>/<arch>/{lib,runtime}` — `Android/arm64`, `IOS/arm64`, `IOSSimulator/arm64`.
            Desktop platforms run the upstream hostfxr host and ship no SDK payload.

            ## Installation
            1. Download the ZIP file
            2. Extract into `Plugins/UnrealSharp/Source/ThirdParty/CoreClrSDK/`
            3. Or build from source: `./BuildCoreClrSDK.sh <dotnet-runtime-dir> <platform> <Debug|Release> <arch>`

            ## Build Info
            Built from: https://github.com/dotnet/runtime.git (${{ env.RUNTIME_TAG }})
            Build date: ${{ github.event.inputs.version }}
          files: |
            package/${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
