name: Build CoreClrSDK - Mobile Platforms

# Builds only what UnrealSharp consumes: Android arm64, iOS device arm64 and the
# iOS Simulator arm64. Desktop (Win64 / Linux / macOS) runs the upstream hostfxr host
# and links nothing from this SDK, so those legs were dead weight.
#
# Every leg calls BuildCoreClrSDK.sh, which owns the platform matrix, the subset list
# (DotNetRuntime.version) and the iOS libs patch — no second copy of any of that here.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      build_android:
        description: 'Build Android arm64'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS device arm64'
        required: false
        type: boolean
        default: true
      build_iossimulator:
        description: 'Build iOS Simulator arm64'
        required: false
        type: boolean
        default: true
      runtime_commit:
        description: 'dotnet/runtime commit SHA (empty = pinned release tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned dotnet/runtime tag. Keep in sync with DotNetRuntime.version RUNTIME_VERSION.
  RUNTIME_TAG: v11.0.0-rc.1.26425.128

jobs:
  build-android:
    runs-on: macos-26
    if: github.event.inputs.build_android == 'true'
    steps:
      - name: Checkout CoreClrSDK
        uses: actions/checkout@v4

      - name: Select Android NDK
        run: |
          set -euo pipefail
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$NDK_DIR" ]; then
            echo "No NDK found under ANDROID_HOME ($ANDROID_HOME)" >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Clone dotnet/runtime
        run: |
          RUNTIME_COMMIT="${{ github.event.inputs.runtime_commit }}"
          git clone --depth 1 --branch "${{ env.RUNTIME_TAG }}" https://github.com/dotnet/runtime.git dotnet-runtime
          if [ -n "$RUNTIME_COMMIT" ]; then
            cd dotnet-runtime
            git fetch --depth=100 origin "$RUNTIME_COMMIT"
            git checkout "$RUNTIME_COMMIT"
          fi

      - name: Build CoreClrSDK (Android arm64)
        run: |
          chmod +x BuildCoreClrSDK.sh CopySDKFromSrc.sh
          ./BuildCoreClrSDK.sh "$(pwd)/dotnet-runtime" android ${{ github.event.inputs.build_type || 'Release' }} arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoreClrSDK-Android-arm64-${{ github.event.inputs.build_type || 'Release' }}
          path: Android/arm64/
          retention-days: 30
          if-no-files-found: error

  build-ios:
    runs-on: macos-26
    if: github.event.inputs.build_ios == 'true'
    steps:
      - name: Checkout CoreClrSDK
        uses: actions/checkout@v4

      - name: Clone dotnet/runtime
        run: |
          RUNTIME_COMMIT="${{ github.event.inputs.runtime_commit }}"
          git clone --depth 1 --branch "${{ env.RUNTIME_TAG }}" https://github.com/dotnet/runtime.git dotnet-runtime
          if [ -n "$RUNTIME_COMMIT" ]; then
            cd dotnet-runtime
            git fetch --depth=100 origin "$RUNTIME_COMMIT"
            git checkout "$RUNTIME_COMMIT"
          fi

      - name: Build CoreClrSDK (iOS device arm64)
        run: |
          chmod +x BuildCoreClrSDK.sh CopySDKFromSrc.sh MakeCoreClrFramework.sh
          ./BuildCoreClrSDK.sh "$(pwd)/dotnet-runtime" ios ${{ github.event.inputs.build_type || 'Release' }} arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoreClrSDK-iOS-arm64-${{ github.event.inputs.build_type || 'Release' }}
          path: IOS/arm64/
          retention-days: 30
          if-no-files-found: error

  build-iossimulator:
    runs-on: macos-26
    if: github.event.inputs.build_iossimulator == 'true'
    steps:
      - name: Checkout CoreClrSDK
        uses: actions/checkout@v4

      - name: Clone dotnet/runtime
        run: |
          RUNTIME_COMMIT="${{ github.event.inputs.runtime_commit }}"
          git clone --depth 1 --branch "${{ env.RUNTIME_TAG }}" https://github.com/dotnet/runtime.git dotnet-runtime
          if [ -n "$RUNTIME_COMMIT" ]; then
            cd dotnet-runtime
            git fetch --depth=100 origin "$RUNTIME_COMMIT"
            git checkout "$RUNTIME_COMMIT"
          fi

      - name: Build CoreClrSDK (iOS Simulator arm64)
        run: |
          chmod +x BuildCoreClrSDK.sh CopySDKFromSrc.sh MakeCoreClrFramework.sh
          ./BuildCoreClrSDK.sh "$(pwd)/dotnet-runtime" iossimulator ${{ github.event.inputs.build_type || 'Release' }} arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoreClrSDK-iOS-Simulator-arm64-${{ github.event.inputs.build_type || 'Release' }}
          path: IOSSimulator/arm64/
          retention-days: 30
          if-no-files-found: error
